[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-dockerfile-orchard"
description = "A tree-sitter module for the Dockerfile grammar"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "dockerfile-orchard"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Camden Cheek", email = "camden@ccheek.com" }]
requires-python = ">=3.10"
license.text = "ISC"
readme = "README.md"

[project.urls]
Homepage = "https://codeberg.org/grammar-orchard/tree-sitter-dockerfile-orchard"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
